<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Machine Language: Scene 01 Static Styleframe (Stage 5)</title>
  <link rel="stylesheet" href="../../../core/amg-tokens.css">
  <link rel="stylesheet" href="../../../core/amg-stage.css">
  <style>
    @scope (#s01-static-root) {
      .scene-wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        position: relative;
      }
      .badge-tag {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 18px;
        border-radius: 20px;
        background: rgba(56, 189, 248, 0.1);
        border: 1px solid rgba(56, 189, 248, 0.3);
        color: #38bdf8;
        font-family: var(--amg-font-sans);
        font-size: 15px;
        font-weight: 600;
        margin-bottom: 24px;
      }
      .headline {
        font-family: var(--amg-font-arabic);
        font-size: 74px;
        font-weight: 800;
        color: #ffffff;
        margin: 0 0 16px 0;
        text-align: center;
        letter-spacing: -0.02em;
        line-height: 1.15;
      }
      .subhead {
        font-family: var(--amg-font-arabic);
        font-size: 24px;
        color: #94a3b8;
        margin: 0 0 44px 0;
        text-align: center;
        max-width: 820px;
      }
      .code-terminal-card {
        width: 840px;
        background: #0b0f19;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 20px;
        padding: 24px 32px;
        box-shadow: 0 25px 70px rgba(0, 0, 0, 0.8), 0 0 40px rgba(56, 189, 248, 0.08);
      }
      .term-header {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 20px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        padding-bottom: 12px;
      }
      .dot { width: 10px; height: 10px; border-radius: 50%; }
      .code-line {
        font-family: var(--amg-font-mono);
        font-size: 24px;
        line-height: 1.8;
        direction: ltr;
        text-align: left;
      }
      .binary-stream {
        display: flex;
        gap: 12px;
        margin-top: 16px;
        font-family: var(--amg-font-mono);
        font-size: 20px;
        color: #38bdf8;
        letter-spacing: 2px;
        direction: ltr;
      }
    }
  </style>
</head>
<body class="amg-body">
  <div id="amg-stage" class="amg-stage amg-crisp-stroke" data-aspect="16:9">
    <div id="amg-camera-rig" class="amg-camera-rig">
      <section id="s01-static-root" class="amg-scene">
        <div class="scene-wrapper">
          <div class="badge-tag">
            <span style="display:inline-block; width:8px; height:8px; border-radius:50%; background:#38bdf8;"></span>
            طبقات التجريد البرمجي • Abstraction Layers
          </div>
          <h1 class="headline">الحاسوب لا يفهم لغتك!</h1>
          <p class="subhead">كل كود تكتبه بالإنجليزية يتحول عبر طبقات معقدة إلى شيء بدائي وخارق في آن واحد.</p>
          
          <div class="code-terminal-card" id="s01-code-window">
            <div class="term-header">
              <span class="dot" style="background:#ef4444;"></span>
              <span class="dot" style="background:#f59e0b;"></span>
              <span class="dot" style="background:#10b981;"></span>
              <span style="margin-left:12px; font-family:var(--amg-font-mono); font-size:13px; color:#64748b;">program.py → binary.bin</span>
            </div>
            <div class="code-line">
              <span style="color:#f43f5e;">print</span><span style="color:#ffffff;">(</span><span style="color:#10b981;">"مرحباً بالعالم"</span><span style="color:#ffffff;">)</span>
            </div>
            <div class="code-line" style="color:#94a3b8; font-size:18px;">
              <span style="color:#6366f1;">MOV</span> R1, 0x48 &nbsp;|&nbsp; <span style="color:#6366f1;">MOV</span> R2, 0x69 &nbsp;|&nbsp; <span style="color:#6366f1;">SYS_WRITE</span>
            </div>
            <div class="binary-stream">
              <span style="color:#38bdf8;">01001000</span>
              <span style="color:#38bdf8;">01100101</span>
              <span style="color:#38bdf8;">01101100</span>
              <span style="color:#38bdf8;">01101100</span>
              <span style="color:#38bdf8;">01101111</span>
            </div>
          </div>
        </div>
      </section>
    </div>
  </div>
  <!-- المرحلة 5: صفر كود تحريك! تم التحقق التام من التباين وتوازن المساحات -->
</body>
</html>
