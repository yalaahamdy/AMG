<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AMG Editorial & Isometric Anatomy Gallery — استوديو المخططات والتشريح ثلاثي الأبعاد</title>
  <link rel="stylesheet" href="../../../core/amg-tokens.css">
  <link rel="stylesheet" href="../../../core/amg-stage.css">
  <style>
    :root {
      --bg-dark: #07090e;
      --panel-border: rgba(255, 255, 255, 0.12);
      --accent-cyan: #38bdf8;
    }
    body {
      margin: 0;
      padding: 0;
      background: var(--bg-dark);
      color: #f8fafc;
      font-family: var(--amg-font-arabic), system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      padding: 16px 32px;
      background: #0b0f19;
      border-bottom: 1px solid var(--panel-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
    }
    .header-title h1 {
      font-size: 20px;
      margin: 0 0 4px 0;
      color: #fff;
    }
    .header-title p {
      font-size: 13px;
      color: #94a3b8;
      margin: 0;
    }
    .tabs-nav {
      display: flex;
      gap: 10px;
    }
    .tab-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--panel-border);
      color: #cbd5e1;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .tab-btn:hover {
      background: rgba(56, 189, 248, 0.12);
      border-color: var(--accent-cyan);
      color: #fff;
    }
    .tab-btn.active {
      background: var(--accent-cyan);
      color: #020306;
      border-color: var(--accent-cyan);
    }
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background: radial-gradient(ellipse at center, #0e1628 0%, #07090e 75%);
      padding: 24px;
    }
    .stage-box {
      width: 100%;
      max-width: 1300px;
      aspect-ratio: 16 / 9;
      position: relative;
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid var(--panel-border);
      box-shadow: 0 30px 100px rgba(0, 0, 0, 0.9), 0 0 70px rgba(56, 189, 248, 0.1);
    }
    .hud-controls {
      position: absolute;
      bottom: 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(14px);
      border: 1px solid var(--panel-border);
      border-radius: 30px;
      padding: 10px 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      z-index: 30;
    }
    .hud-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--panel-border);
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.2s ease;
    }
    .hud-btn:hover {
      background: var(--accent-cyan);
      color: #020306;
    }
    .time-slider {
      width: 300px;
      accent-color: var(--accent-cyan);
    }
    .time-val {
      font-family: var(--amg-font-mono);
      font-size: 14px;
      color: var(--accent-cyan);
      min-width: 90px;
      text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-title">
      <h1>معمل المخططات التحريرية والتشريح الإيزومتري</h1>
      <p>بديل احترافي لـ Mermaid Slop مع إسقاط ثلاثي الأبعاد حقيقي</p>
    </div>
    <div class="tabs-nav">
      <button class="tab-btn active" data-type="mesh">معمارية الشبكة (Mesh)</button>
      <button class="tab-btn" data-type="stepper">التقدم المرحلي (Stepper)</button>
      <button class="tab-btn" data-type="quad">مصفوفة 2x2 (Matrix)</button>
      <button class="tab-btn" data-type="onion">البصلة المتراكزة (Onion)</button>
      <button class="tab-btn" data-type="iso">التفكيك الإيزومتري 3D</button>
    </div>
  </header>

  <main>
    <div class="stage-box">
      <div id="amg-stage" class="amg-stage amg-crisp-stroke" data-aspect="16:9">
        <div id="amg-camera-rig" class="amg-camera-rig">
          <div id="diagram-mount" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;"></div>
        </div>
      </div>
    </div>

    <div class="hud-controls">
      <button class="hud-btn" id="btn-toggle">تشغيل ▶</button>
      <button class="hud-btn" id="btn-restart">إعادة ↺</button>
      <input type="range" class="time-slider" id="time-slider" min="0" max="4000" value="0">
      <div class="time-val" id="time-val">0.00s / 4.00s</div>
    </div>
  </main>

  <script type="module">
    import { AMGEditorialDiagramEngine } from '../../../core/amg-editorial-diagram-engine.js';
    import { AMGIsometricAnatomyPro } from '../../../core/amg-isometric-anatomy-pro.js';
    import { AMGClock } from '../../../core/amg-clock.js';
    import { AMGCameraRig } from '../../../core/amg-camera.js';

    let clock = null;
    let camera = null;
    let activeType = 'mesh';

    const mount = document.getElementById('diagram-mount');
    const timeSlider = document.getElementById('time-slider');
    const timeVal = document.getElementById('time-val');
    const btnToggle = document.getElementById('btn-toggle');
    const btnRestart = document.getElementById('btn-restart');

    function loadDiagram(type) {
      activeType = type;
      document.querySelectorAll('.tab-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.type === type);
      });

      if (clock) clock.pause();
      const durationMs = 3500;
      timeSlider.max = durationMs;
      timeSlider.value = 0;

      clock = new AMGClock({ durationMs, fps: 60 });
      camera = new AMGCameraRig('#amg-camera-rig', clock);
      const tl = clock.masterTimeline;

      mount.innerHTML = '';

      if (type === 'mesh') {
        mount.innerHTML = AMGEditorialDiagramEngine.createMicroservicesMesh();
        AMGEditorialDiagramEngine.animateMicroservicesMesh(tl, mount, { start: 0, camera });
      } else if (type === 'stepper') {
        mount.innerHTML = AMGEditorialDiagramEngine.createLinearStepper();
        AMGEditorialDiagramEngine.animateLinearStepper(tl, mount, { start: 0 });
      } else if (type === 'quad') {
        mount.innerHTML = AMGEditorialDiagramEngine.createQuadrantMatrix();
        AMGEditorialDiagramEngine.animateQuadrantMatrix(tl, mount, { start: 0 });
      } else if (type === 'onion') {
        mount.innerHTML = AMGEditorialDiagramEngine.createConcentricOnion();
        AMGEditorialDiagramEngine.animateConcentricOnion(tl, mount, { start: 0 });
      } else if (type === 'iso') {
        mount.innerHTML = AMGIsometricAnatomyPro.createExplodedViewStack();
        AMGIsometricAnatomyPro.animateExplodedView(tl, mount, { start: 0, spacing: 100 });
      }

      clock.onTick((timeMs) => {
        timeSlider.value = timeMs;
        timeVal.textContent = `${(timeMs / 1000).toFixed(2)}s / ${(durationMs / 1000).toFixed(2)}s`;
      });

      clock.play();
      btnToggle.textContent = 'إيقاف ⏸';
    }

    document.querySelectorAll('.tab-btn').forEach(b => {
      b.onclick = () => loadDiagram(b.dataset.type);
    });

    btnToggle.onclick = () => {
      if (!clock) return;
      if (clock.isPlaying) {
        clock.pause();
        btnToggle.textContent = 'تشغيل ▶';
      } else {
        clock.play();
        btnToggle.textContent = 'إيقاف ⏸';
      }
    };

    btnRestart.onclick = () => {
      if (!clock) return;
      clock.seek(0);
      clock.play();
      btnToggle.textContent = 'إيقاف ⏸';
    };

    timeSlider.oninput = (e) => {
      if (!clock) return;
      clock.seek(Number(e.target.value) / 1000);
      btnToggle.textContent = 'تشغيل ▶';
    };

    // البدء بالمخطط الشبكي
    loadDiagram('mesh');
  </script>
</body>
</html>
