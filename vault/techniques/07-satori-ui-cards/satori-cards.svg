<svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
  <defs>
    <!-- Satori Code Window Symbol -->
    <symbol id="satori-code-window" viewBox="0 0 600 360">
      <rect width="600" height="360" rx="16" fill="#0f1117" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
      <circle cx="28" cy="24" r="6" fill="#ef4444"/>
      <circle cx="48" cy="24" r="6" fill="#f59e0b"/>
      <circle cx="68" cy="24" r="6" fill="#10b981"/>
      <line x1="0" y1="48" x2="600" y2="48" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <!-- Mock code lines -->
      <rect x="28" y="72" width="140" height="12" rx="4" fill="#38bdf8" opacity="0.8"/>
      <rect x="180" y="72" width="80" height="12" rx="4" fill="#94a3b8" opacity="0.5"/>
      <rect x="48" y="104" width="220" height="12" rx="4" fill="#6366f1" opacity="0.8"/>
      <rect x="48" y="136" width="180" height="12" rx="4" fill="#10b981" opacity="0.8"/>
      <rect x="28" y="168" width="40" height="12" rx="4" fill="#38bdf8" opacity="0.8"/>
    </symbol>
    <!-- Satori Metric Card Symbol -->
    <symbol id="satori-metric-card" viewBox="0 0 340 180">
      <rect width="340" height="180" rx="16" fill="#131722" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
      <text x="24" y="44" fill="#94a3b8" font-family="sans-serif" font-size="14" font-weight="500">النمو الشهري النشط</text>
      <text x="24" y="96" fill="#ffffff" font-family="sans-serif" font-size="36" font-weight="700">+348%</text>
      <rect x="24" y="120" width="80" height="24" rx="12" fill="rgba(16,185,129,0.15)"/>
      <text x="36" y="136" fill="#10b981" font-family="sans-serif" font-size="12" font-weight="600">▲ نمو فائق</text>
    </symbol>
  </defs>
</svg>
