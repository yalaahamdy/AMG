<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AMG Icon Vault — استعراض الأيقونات المتجهة</title>
  <style>
    :root {
      --bg: #050508;
      --card-bg: #0f172a;
      --text: #f8fafc;
      --muted: #94a3b8;
      --cyan: #38bdf8;
      --border: rgba(255, 255, 255, 0.1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      padding: 40px;
    }
    header {
      margin-bottom: 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    h1 { font-size: 24px; color: var(--cyan); }
    .search-bar {
      padding: 10px 18px;
      border-radius: 10px;
      background: #1e293b;
      border: 1px solid var(--border);
      color: #fff;
      font-size: 14px;
      width: 300px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 20px;
    }
    .icon-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      cursor: pointer;
      transition: all 0.25s ease;
    }
    .icon-card:hover {
      border-color: var(--cyan);
      transform: translateY(-4px);
    }
    .icon-preview {
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--cyan);
    }
    .icon-name {
      font-size: 13px;
      color: var(--muted);
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>خزينة الأيقونات المتجهة (AMG Icon Vault)</h1>
      <p style="color: var(--muted); font-size: 14px; margin-top: 4px;">أيقونات تقنية وهندسية مجهزة للرسم الحركي السلس (Pure SVG Zero Dependencies)</p>
    </div>
    <input type="text" class="search-bar" placeholder="بحث عن أيقونة...">
  </header>

  <div class="grid">
    <div class="icon-card">
      <div class="icon-preview">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg>
      </div>
      <div class="icon-name">Cloud Architecture</div>
    </div>
    <div class="icon-card">
      <div class="icon-preview">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="8" x="2" y="2" rx="2" ry="2"/><rect width="20" height="8" x="2" y="14" rx="2" ry="2"/><line x1="6" x2="6.01" y1="6" y2="6"/><line x1="6" x2="6.01" y1="18" y2="18"/></svg>
      </div>
      <div class="icon-name">Server Node</div>
    </div>
    <div class="icon-card">
      <div class="icon-preview">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/></svg>
      </div>
      <div class="icon-name">Database Cluster</div>
    </div>
    <div class="icon-card">
      <div class="icon-preview">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/></svg>
      </div>
      <div class="icon-name">Security Shield</div>
    </div>
    <div class="icon-card">
      <div class="icon-preview">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      </div>
      <div class="icon-name">Telemetry Heartbeat</div>
    </div>
    <div class="icon-card">
      <div class="icon-preview">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg>
      </div>
      <div class="icon-name">Media Play</div>
    </div>
    <div class="icon-card">
      <div class="icon-preview">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.29 7 12 12 20.71 7"/><line x1="12" x2="12" y1="22" y2="12"/></svg>
      </div>
      <div class="icon-name">Isometric Cube</div>
    </div>
    <div class="icon-card">
      <div class="icon-preview">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M12 12v9"/><path d="m8 17 4 4 4-4"/></svg>
      </div>
      <div class="icon-name">Cloud Download</div>
    </div>
  </div>
</body>
</html>
